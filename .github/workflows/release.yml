name: Release updater and GEOFlow images

on:
  workflow_dispatch:
    inputs:
      updater_version:
        description: Updater semantic version without v prefix
        required: true
        type: string
      geoflow_ref:
        description: GEOFlow tag or immutable commit to build
        required: true
        type: string
      geoflow_version:
        description: GEOFlow semantic version without v prefix
        required: true
        type: string
      release_sequence:
        description: Monotonically increasing GEOFlow release sequence
        required: true
        type: number
      candidate_run_id:
        description: Successful Phase C candidate workflow run ID
        required: true
        type: number
      phase_c_evidence_sha256:
        description: SHA-256 of the approved Phase C rehearsal evidence JSON
        required: true
        type: string

permissions:
  actions: write
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: geoflow-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      resume: ${{ steps.release-state.outputs.resume }}
      geoflow_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yaojingang/GEOFlow
          ref: ${{ inputs.geoflow_ref }}
          path: geoflow
      - name: Validate immutable release inputs and source version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_VERSION: ${{ inputs.updater_version }}
          GEOFLOW_REF: ${{ inputs.geoflow_ref }}
          GEOFLOW_VERSION: ${{ inputs.geoflow_version }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$UPDATER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$GEOFLOW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          [[ "$GEOFLOW_REF" == "v$GEOFLOW_VERSION" || "$GEOFLOW_REF" =~ ^[a-f0-9]{40}$ || "$GEOFLOW_REF" =~ ^[a-f0-9]{64}$ ]]
          test "$(jq -er '.version' geoflow/version.json)" = "$GEOFLOW_VERSION"
      - id: source
        name: Pin the resolved GEOFlow source
        env:
          GEOFLOW_REF: ${{ inputs.geoflow_ref }}
        run: |
          source_sha="$(git -C geoflow rev-parse HEAD)"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$|^[a-f0-9]{64}$ ]]
          if [[ "$GEOFLOW_REF" =~ ^[a-f0-9]{40}$|^[a-f0-9]{64}$ ]]; then
            test "$source_sha" = "$GEOFLOW_REF"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - id: release-state
        name: Detect a safe publication resume
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_VERSION: ${{ inputs.updater_version }}
          GEOFLOW_SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
          GEOFLOW_VERSION: ${{ inputs.geoflow_version }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
        run: |
          snapshot_version="$(jq -er '.signed.meta["snapshot.json"].version' tuf/repository/metadata/timestamp.json)"
          targets_version="$(jq -er '.signed.meta["targets.json"].version' "tuf/repository/metadata/${snapshot_version}.snapshot.json")"
          targets_metadata="tuf/repository/metadata/${targets_version}.targets.json"
          current_sequence=0
          current_version=""
          manifest=""
          if jq -e '.signed.targets["releases/current.json"] != null' "$targets_metadata" >/dev/null; then
            manifest_hash="$(jq -er '.signed.targets["releases/current.json"].hashes.sha256' "$targets_metadata")"
            manifest="tuf/repository/targets/releases/${manifest_hash}.current.json"
            current_sequence="$(jq -er '.release_sequence' "$manifest")"
            current_version="$(jq -er '.version' "$manifest")"
          fi
          resume=false
          if [ "$current_sequence" = "$RELEASE_SEQUENCE" ] && [ "$current_version" = "$GEOFLOW_VERSION" ]; then
            test "$(jq -er '.schema_version' "$manifest")" = "2"
            test "$(jq -er '.minimum_updater_protocol' "$manifest")" = "2"
            test "$(jq -er '.source_commit' "$manifest")" = "$GEOFLOW_SOURCE_COMMIT"
            version_target="$(jq -er '.version_target' "$manifest")"
            test "$version_target" = "releases/$GEOFLOW_VERSION/version.json"
            jq -e --arg target "$version_target" '.signed.targets[$target] != null' "tuf/repository/metadata/${targets_version}.targets.json" >/dev/null
            for target in \
              "updater/$UPDATER_VERSION/geoflow-updater_${UPDATER_VERSION}_linux_amd64.tar.gz" \
              "updater/$UPDATER_VERSION/geoflow-updater_${UPDATER_VERSION}_linux_arm64.tar.gz" \
              "updater/$UPDATER_VERSION/checksums.txt"; do
              jq -e --arg target "$target" '.signed.targets[$target] != null' "tuf/repository/metadata/${targets_version}.targets.json" >/dev/null
            done
            if ! gh release view "v$UPDATER_VERSION" --repo yaojingang/geoflow-updater >/dev/null 2>&1; then
              echo "Signed metadata already contains this GEOFlow release, but its updater release is missing." >&2
              exit 1
            fi
            resume=true
          elif [ "$RELEASE_SEQUENCE" -le "$current_sequence" ]; then
            echo "Release sequence $RELEASE_SEQUENCE must exceed signed sequence $current_sequence." >&2
            exit 1
          elif gh release view "v$UPDATER_VERSION" --repo yaojingang/geoflow-updater --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
            echo "Published updater version v$UPDATER_VERSION is immutable." >&2
            exit 1
          fi
          echo "resume=$resume" >> "$GITHUB_OUTPUT"
      - name: Verify updater source
        run: |
          test -z "$(gofmt -l cmd internal tuf)"
          go vet ./...
          go test -race ./...

  publish:
    needs: preflight
    if: needs.preflight.result == 'success'
    environment: release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yaojingang/GEOFlow
          ref: ${{ needs.preflight.outputs.geoflow_sha }}
          path: geoflow
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the approved candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq '.head_sha')" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq '.name')" = "Build Phase C release candidate"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq '.path')" = ".github/workflows/release-candidate.yml"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq '.event')" = "workflow_dispatch"
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "phase-c-candidate-$CANDIDATE_RUN_ID" \
            --dir candidate
      - name: Validate candidate identity and protected rehearsal evidence
        env:
          APPROVED_EVIDENCE_B64: ${{ secrets.PHASE_C_REHEARSAL_EVIDENCE_B64 }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHASE_C_EVIDENCE_SHA256: ${{ inputs.phase_c_evidence_sha256 }}
          UPDATER_VERSION: ${{ inputs.updater_version }}
          GEOFLOW_SOURCE_COMMIT: ${{ needs.preflight.outputs.geoflow_sha }}
          GEOFLOW_VERSION: ${{ inputs.geoflow_version }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
        run: |
          [[ "$UPDATER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$GEOFLOW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          [[ "$PHASE_C_EVIDENCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(jq -er '.schema_version' candidate/candidate.json)" = "1"
          test "$(jq -er '.candidate_run_id' candidate/candidate.json)" = "$CANDIDATE_RUN_ID"
          test "$(jq -er '.updater.version' candidate/candidate.json)" = "$UPDATER_VERSION"
          test "$(jq -er '.updater.commit' candidate/candidate.json)" = "$GITHUB_SHA"
          test "$(jq -er '.geoflow.version' candidate/candidate.json)" = "$GEOFLOW_VERSION"
          test "$(jq -er '.geoflow.commit' candidate/candidate.json)" = "$GEOFLOW_SOURCE_COMMIT"
          test "$(jq -er '.geoflow.release_sequence' candidate/candidate.json)" = "$RELEASE_SEQUENCE"
          for arch in amd64 arm64; do
            archive="candidate/dist/geoflow-updater_${UPDATER_VERSION}_linux_${arch}.tar.gz"
            expected="$(jq -er --arg platform "linux-$arch" '.updater.archives[$platform]' candidate/candidate.json)"
            test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$expected"
          done
          test "$(sha256sum candidate/targets-source/releases/current.json | cut -d ' ' -f 1)" = "$(jq -er '.targets.release_manifest_sha256' candidate/candidate.json)"
          test "$(sha256sum candidate/targets-source/deploy/docker-compose.managed.yml | cut -d ' ' -f 1)" = "$(jq -er '.targets.compose_sha256' candidate/candidate.json)"
          test "$(sha256sum "candidate/targets-source/releases/$GEOFLOW_VERSION/version.json" | cut -d ' ' -f 1)" = "$(jq -er '.targets.version_document_sha256' candidate/candidate.json)"
          test "$(jq -er '.schema_version' candidate/targets-source/releases/current.json)" = "2"
          test "$(jq -er '.minimum_updater_protocol' candidate/targets-source/releases/current.json)" = "2"
          test "$(jq -er '.source_commit' candidate/targets-source/releases/current.json)" = "$GEOFLOW_SOURCE_COMMIT"
          test "$(sha256sum assets/docker-compose.managed.yml | cut -d ' ' -f 1)" = "$(jq -er '.targets.compose_sha256' candidate/candidate.json)"
          test "$(sha256sum geoflow/version.json | cut -d ' ' -f 1)" = "$(jq -er '.targets.version_document_sha256' candidate/candidate.json)"
          for image in app web; do
            digest="$(jq -er --arg image "$image" '.geoflow[$image + "_digest"]' candidate/candidate.json)"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            repository="ghcr.io/yaojingang/geoflow-$image"
            index="$(docker buildx imagetools inspect --raw "$repository@$digest")"
            jq -e 'any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64")' <<<"$index" >/dev/null
            jq -e 'any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")' <<<"$index" >/dev/null
          done
          evidence="$RUNNER_TEMP/phase-c-rehearsal-evidence.json"
          umask 077
          printf '%s' "$APPROVED_EVIDENCE_B64" | base64 --decode > "$evidence"
          test "$(sha256sum "$evidence" | cut -d ' ' -f 1)" = "$PHASE_C_EVIDENCE_SHA256"
          jq -e --slurpfile candidate candidate/candidate.json '
            .schema_version == 1 and
            .candidate == $candidate[0] and
            .architectures["linux-amd64"].result == "pass" and
            (.architectures["linux-amd64"].evidence_link | length > 0) and
            .architectures["linux-arm64"].result == "pass" and
            (.architectures["linux-arm64"].evidence_link | length > 0) and
            .approvals.release_operator.decision == "approved" and
            (.approvals.release_operator.name | length > 0) and
            .approvals.security_reviewer.decision == "approved" and
            (.approvals.security_reviewer.name | length > 0) and
            .approvals.product_owner.decision == "approved" and
            (.approvals.product_owner.name | length > 0)
          ' "$evidence" >/dev/null
          if [ "${{ needs.preflight.outputs.resume }}" = "true" ]; then
            snapshot_version="$(jq -er '.signed.meta["snapshot.json"].version' tuf/repository/metadata/timestamp.json)"
            targets_version="$(jq -er '.signed.meta["targets.json"].version' "tuf/repository/metadata/${snapshot_version}.snapshot.json")"
            manifest_hash="$(jq -er '.signed.targets["releases/current.json"].hashes.sha256' "tuf/repository/metadata/${targets_version}.targets.json")"
            test "$manifest_hash" = "$(jq -er '.targets.release_manifest_sha256' candidate/candidate.json)"
          fi
          for archive in candidate/dist/geoflow-updater_*.tar.gz; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
              --source-digest "$GITHUB_SHA"
          done
      - name: Materialize online signing keys
        if: needs.preflight.outputs.resume != 'true'
        env:
          TARGETS_KEY_B64: ${{ secrets.TUF_TARGETS_KEY_B64 }}
          SNAPSHOT_KEY_B64: ${{ secrets.TUF_SNAPSHOT_KEY_B64 }}
          TIMESTAMP_KEY_B64: ${{ secrets.TUF_TIMESTAMP_KEY_B64 }}
        run: |
          umask 077
          printf '%s' "$TARGETS_KEY_B64" | base64 --decode > "$RUNNER_TEMP/targets.pem"
          printf '%s' "$SNAPSHOT_KEY_B64" | base64 --decode > "$RUNNER_TEMP/snapshot.pem"
          printf '%s' "$TIMESTAMP_KEY_B64" | base64 --decode > "$RUNNER_TEMP/timestamp.pem"
      - name: Publish TUF targets and metadata
        if: needs.preflight.outputs.resume != 'true'
        run: |
          go run ./cmd/geoflow-tuf publish \
            --repository-dir tuf/repository \
            --targets-dir candidate/targets-source \
            --targets-key "$RUNNER_TEMP/targets.pem" \
            --snapshot-key "$RUNNER_TEMP/snapshot.pem" \
            --timestamp-key "$RUNNER_TEMP/timestamp.pem"
      - name: Stage updater assets in a draft GitHub release
        if: needs.preflight.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_VERSION: ${{ inputs.updater_version }}
          GEOFLOW_VERSION: ${{ inputs.geoflow_version }}
        run: |
          if gh release view "v$UPDATER_VERSION" >/dev/null 2>&1; then
            test "$(gh release view "v$UPDATER_VERSION" --json isDraft --jq '.isDraft')" = true
            gh release edit "v$UPDATER_VERSION" --target "$GITHUB_SHA"
            gh release upload "v$UPDATER_VERSION" \
              candidate/dist/geoflow-updater_*.tar.gz \
              candidate/dist/checksums.txt \
              candidate/dist/bootstrap-manifest.json \
              --clobber
          else
            gh release create "v$UPDATER_VERSION" \
              candidate/dist/geoflow-updater_*.tar.gz \
              candidate/dist/checksums.txt \
              candidate/dist/bootstrap-manifest.json \
              --draft \
              --target "$GITHUB_SHA" \
              --title "GEOFlow Updater v$UPDATER_VERSION" \
              --notes "Installs GEOFlow Updater and enrolls GEOFlow $GEOFLOW_VERSION managed deployments."
          fi
      - name: Commit public TUF metadata
        if: needs.preflight.outputs.resume != 'true'
        env:
          GEOFLOW_VERSION: ${{ inputs.geoflow_version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuf/repository
          git commit -m "release: publish GEOFlow $GEOFLOW_VERSION metadata"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Validate and publish the updater release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_VERSION: ${{ inputs.updater_version }}
        run: |
          release_dir="$(mktemp -d)"
          gh release download "v$UPDATER_VERSION" --dir "$release_dir"
          assets="$(find "$release_dir" -maxdepth 1 -type f -exec basename {} \; | sort)"
          for required in \
            "geoflow-updater_${UPDATER_VERSION}_linux_amd64.tar.gz" \
            "geoflow-updater_${UPDATER_VERSION}_linux_arm64.tar.gz" \
            checksums.txt \
            bootstrap-manifest.json; do
            printf '%s\n' "$assets" | grep -Fqx "$required"
          done
          snapshot_version="$(jq -er '.signed.meta["snapshot.json"].version' tuf/repository/metadata/timestamp.json)"
          targets_version="$(jq -er '.signed.meta["targets.json"].version' "tuf/repository/metadata/${snapshot_version}.snapshot.json")"
          targets_metadata="tuf/repository/metadata/${targets_version}.targets.json"
          for asset in \
            "geoflow-updater_${UPDATER_VERSION}_linux_amd64.tar.gz" \
            "geoflow-updater_${UPDATER_VERSION}_linux_arm64.tar.gz" \
            checksums.txt; do
            target="updater/$UPDATER_VERSION/$asset"
            expected_hash="$(jq -er --arg target "$target" '.signed.targets[$target].hashes.sha256' "$targets_metadata")"
            expected_length="$(jq -er --arg target "$target" '.signed.targets[$target].length' "$targets_metadata")"
            test "$(sha256sum "$release_dir/$asset" | cut -d ' ' -f 1)" = "$expected_hash"
            test "$(stat -c '%s' "$release_dir/$asset")" = "$expected_length"
          done
          go run ./cmd/geoflow-tuf verify-bootstrap \
            --manifest "$release_dir/bootstrap-manifest.json" \
            --trusted-root tuf/repository/metadata/root.json \
            --updater-version "$UPDATER_VERSION"
          for arch in amd64 arm64; do
            archive="geoflow-updater_${UPDATER_VERSION}_linux_${arch}.tar.gz"
            platform="linux-${arch}"
            test "$(jq -er --arg platform "$platform" '.signed.assets[$platform].sha256' "$release_dir/bootstrap-manifest.json")" = "$(sha256sum "$release_dir/$archive" | cut -d ' ' -f 1)"
            test "$(jq -er --arg platform "$platform" '.signed.assets[$platform].size' "$release_dir/bootstrap-manifest.json")" = "$(stat -c '%s' "$release_dir/$archive")"
          done
          if [ "$(gh release view "v$UPDATER_VERSION" --json isDraft --jq '.isDraft')" = true ]; then
            gh release edit "v$UPDATER_VERSION" --draft=false --latest=false
          fi
      - name: Promote immutable and convenience image tags
        env:
          GEOFLOW_VERSION: ${{ inputs.geoflow_version }}
        run: |
          APP_DIGEST="$(jq -er '.geoflow.app_digest' candidate/candidate.json)"
          WEB_DIGEST="$(jq -er '.geoflow.web_digest' candidate/candidate.json)"
          promote() {
            repository="$1"
            digest="$2"
            version_ref="$repository:$GEOFLOW_VERSION"
            if docker buildx imagetools inspect "$version_ref" >/dev/null 2>&1; then
              existing="$(docker buildx imagetools inspect "$version_ref" --format '{{.Manifest.Digest}}')"
              if [ "$existing" != "$digest" ]; then
                echo "$version_ref already points to unexpected digest $existing." >&2
                exit 1
              fi
            else
              docker buildx imagetools create --tag "$version_ref" "$repository@$digest"
            fi
            docker buildx imagetools create --tag "$repository:latest" "$repository@$digest"
          }
          promote ghcr.io/yaojingang/geoflow-app "$APP_DIGEST"
          promote ghcr.io/yaojingang/geoflow-web "$WEB_DIGEST"
      - name: Deploy committed metadata through Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.preflight.outputs.resume != 'true'
        with:
          name: geoflow-updater-${{ inputs.updater_version }}
          path: |
            candidate/dist/geoflow-updater_*.tar.gz
            candidate/dist/checksums.txt
            candidate/dist/bootstrap-manifest.json
          if-no-files-found: error
