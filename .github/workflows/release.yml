name: Release updater and GEOFlow images

on:
  workflow_dispatch:
    inputs:
      updater_version:
        description: Updater semantic version without v prefix
        required: true
        type: string
      geoflow_ref:
        description: GEOFlow tag or immutable commit to build
        required: true
        type: string
      geoflow_version:
        description: GEOFlow semantic version without v prefix
        required: true
        type: string
      release_sequence:
        description: Monotonically increasing GEOFlow release sequence
        required: true
        type: number

permissions:
  actions: write
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: geoflow-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      resume: ${{ steps.release-state.outputs.resume }}
      app_digest: ${{ steps.release-state.outputs.app_digest }}
      web_digest: ${{ steps.release-state.outputs.web_digest }}
      geoflow_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yaojingang/GEOFlow
          ref: ${{ inputs.geoflow_ref }}
          path: geoflow
      - name: Validate immutable release inputs and source version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_VERSION: ${{ inputs.updater_version }}
          GEOFLOW_REF: ${{ inputs.geoflow_ref }}
          GEOFLOW_VERSION: ${{ inputs.geoflow_version }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
        run: |
          [[ "$UPDATER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$GEOFLOW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          [[ "$GEOFLOW_REF" == "v$GEOFLOW_VERSION" || "$GEOFLOW_REF" =~ ^[a-f0-9]{40}$ || "$GEOFLOW_REF" =~ ^[a-f0-9]{64}$ ]]
          test "$(jq -er '.version' geoflow/version.json)" = "$GEOFLOW_VERSION"
      - id: source
        name: Pin the resolved GEOFlow source
        env:
          GEOFLOW_REF: ${{ inputs.geoflow_ref }}
        run: |
          source_sha="$(git -C geoflow rev-parse HEAD)"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$|^[a-f0-9]{64}$ ]]
          if [[ "$GEOFLOW_REF" =~ ^[a-f0-9]{40}$|^[a-f0-9]{64}$ ]]; then
            test "$source_sha" = "$GEOFLOW_REF"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - id: release-state
        name: Detect a safe publication resume
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_VERSION: ${{ inputs.updater_version }}
          GEOFLOW_SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
          GEOFLOW_VERSION: ${{ inputs.geoflow_version }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
        run: |
          snapshot_version="$(jq -er '.signed.meta["snapshot.json"].version' tuf/repository/metadata/timestamp.json)"
          targets_version="$(jq -er '.signed.meta["targets.json"].version' "tuf/repository/metadata/${snapshot_version}.snapshot.json")"
          targets_metadata="tuf/repository/metadata/${targets_version}.targets.json"
          current_sequence=0
          current_version=""
          manifest=""
          if jq -e '.signed.targets["releases/current.json"] != null' "$targets_metadata" >/dev/null; then
            manifest_hash="$(jq -er '.signed.targets["releases/current.json"].hashes.sha256' "$targets_metadata")"
            manifest="tuf/repository/targets/releases/${manifest_hash}.current.json"
            current_sequence="$(jq -er '.release_sequence' "$manifest")"
            current_version="$(jq -er '.version' "$manifest")"
          fi
          resume=false
          if [ "$current_sequence" = "$RELEASE_SEQUENCE" ] && [ "$current_version" = "$GEOFLOW_VERSION" ]; then
            test "$(jq -er '.source_commit' "$manifest")" = "$GEOFLOW_SOURCE_COMMIT"
            version_target="$(jq -er '.version_target' "$manifest")"
            test "$version_target" = "releases/$GEOFLOW_VERSION/version.json"
            jq -e --arg target "$version_target" '.signed.targets[$target] != null' "tuf/repository/metadata/${targets_version}.targets.json" >/dev/null
            for target in \
              "updater/$UPDATER_VERSION/geoflow-updater_${UPDATER_VERSION}_linux_amd64.tar.gz" \
              "updater/$UPDATER_VERSION/geoflow-updater_${UPDATER_VERSION}_linux_arm64.tar.gz" \
              "updater/$UPDATER_VERSION/checksums.txt"; do
              jq -e --arg target "$target" '.signed.targets[$target] != null' "tuf/repository/metadata/${targets_version}.targets.json" >/dev/null
            done
            if ! gh release view "v$UPDATER_VERSION" --repo yaojingang/geoflow-updater >/dev/null 2>&1; then
              echo "Signed metadata already contains this GEOFlow release, but its updater release is missing." >&2
              exit 1
            fi
            resume=true
            app_image="$(jq -er '.app_image' "$manifest")"
            web_image="$(jq -er '.web_image' "$manifest")"
            echo "app_digest=${app_image#*@}" >> "$GITHUB_OUTPUT"
            echo "web_digest=${web_image#*@}" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE_SEQUENCE" -le "$current_sequence" ]; then
            echo "Release sequence $RELEASE_SEQUENCE must exceed signed sequence $current_sequence." >&2
            exit 1
          elif gh release view "v$UPDATER_VERSION" --repo yaojingang/geoflow-updater --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
            echo "Published updater version v$UPDATER_VERSION is immutable." >&2
            exit 1
          fi
          echo "resume=$resume" >> "$GITHUB_OUTPUT"
      - name: Verify updater source
        run: |
          test -z "$(gofmt -l cmd internal tuf)"
          go vet ./...
          go test -race ./...

  images:
    needs: preflight
    if: needs.preflight.outputs.resume != 'true'
    environment: release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      app_digest: ${{ steps.app.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yaojingang/GEOFlow
          ref: ${{ needs.preflight.outputs.geoflow_sha }}
          path: geoflow
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: geoflow
          file: geoflow/docker/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/yaojingang/geoflow-app:staging-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
          sbom: true
      - id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: geoflow
          file: geoflow/docker/nginx/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/yaojingang/geoflow-web:staging-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
          sbom: true

  publish:
    needs: [preflight, images]
    if: always() && needs.preflight.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    environment: release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yaojingang/GEOFlow
          ref: ${{ needs.preflight.outputs.geoflow_sha }}
          path: geoflow
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release inputs
        env:
          UPDATER_VERSION: ${{ inputs.updater_version }}
          GEOFLOW_VERSION: ${{ inputs.geoflow_version }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
        run: |
          [[ "$UPDATER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          [[ "$GEOFLOW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
      - name: Build release archives
        if: needs.preflight.outputs.resume != 'true'
        env:
          UPDATER_VERSION: ${{ inputs.updater_version }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            stage="$(mktemp -d)"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$UPDATER_VERSION" -o "$stage/geoflow-updater" ./cmd/geoflow-updater
            cp -R packaging "$stage/packaging"
            cp LICENSE README.md "$stage/"
            tar -C "$stage" -czf "dist/geoflow-updater_${UPDATER_VERSION}_linux_${arch}.tar.gz" .
          done
          (cd dist && sha256sum geoflow-updater_*.tar.gz > checksums.txt)
      - name: Materialize online signing keys
        if: needs.preflight.outputs.resume != 'true'
        env:
          TARGETS_KEY_B64: ${{ secrets.TUF_TARGETS_KEY_B64 }}
          SNAPSHOT_KEY_B64: ${{ secrets.TUF_SNAPSHOT_KEY_B64 }}
          TIMESTAMP_KEY_B64: ${{ secrets.TUF_TIMESTAMP_KEY_B64 }}
        run: |
          umask 077
          printf '%s' "$TARGETS_KEY_B64" | base64 --decode > "$RUNNER_TEMP/targets.pem"
          printf '%s' "$SNAPSHOT_KEY_B64" | base64 --decode > "$RUNNER_TEMP/snapshot.pem"
          printf '%s' "$TIMESTAMP_KEY_B64" | base64 --decode > "$RUNNER_TEMP/timestamp.pem"
      - name: Create signed bootstrap manifest
        if: needs.preflight.outputs.resume != 'true'
        env:
          UPDATER_VERSION: ${{ inputs.updater_version }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
        run: |
          amd64_archive="dist/geoflow-updater_${UPDATER_VERSION}_linux_amd64.tar.gz"
          arm64_archive="dist/geoflow-updater_${UPDATER_VERSION}_linux_arm64.tar.gz"
          expires="$(date -u -d '+30 days' '+%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg version "$UPDATER_VERSION" \
            --argjson sequence "$RELEASE_SEQUENCE" \
            --arg expires "$expires" \
            --arg amd64_url "https://github.com/yaojingang/geoflow-updater/releases/download/v${UPDATER_VERSION}/$(basename "$amd64_archive")" \
            --arg amd64_sha "$(sha256sum "$amd64_archive" | cut -d ' ' -f 1)" \
            --argjson amd64_size "$(stat -c '%s' "$amd64_archive")" \
            --arg arm64_url "https://github.com/yaojingang/geoflow-updater/releases/download/v${UPDATER_VERSION}/$(basename "$arm64_archive")" \
            --arg arm64_sha "$(sha256sum "$arm64_archive" | cut -d ' ' -f 1)" \
            --argjson arm64_size "$(stat -c '%s' "$arm64_archive")" \
            '{schema_version:1,release_sequence:$sequence,updater_version:$version,expires:$expires,assets:{"linux-amd64":{url:$amd64_url,sha256:$amd64_sha,size:$amd64_size},"linux-arm64":{url:$arm64_url,sha256:$arm64_sha,size:$arm64_size}}}' \
            > dist/bootstrap-manifest.unsigned.json
          go run ./cmd/geoflow-tuf sign-bootstrap \
            --manifest dist/bootstrap-manifest.unsigned.json \
            --targets-key "$RUNNER_TEMP/targets.pem" \
            --output dist/bootstrap-manifest.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.preflight.outputs.resume != 'true'
        with:
          subject-path: dist/geoflow-updater_*.tar.gz
      - name: Publish TUF targets and metadata
        if: needs.preflight.outputs.resume != 'true'
        env:
          APP_DIGEST: ${{ needs.images.outputs.app_digest }}
          WEB_DIGEST: ${{ needs.images.outputs.web_digest }}
          GEOFLOW_VERSION: ${{ inputs.geoflow_version }}
          GEOFLOW_SOURCE_COMMIT: ${{ needs.preflight.outputs.geoflow_sha }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
          UPDATER_VERSION: ${{ inputs.updater_version }}
        run: |
          targets_dir="$(mktemp -d)"
          mkdir -p "$targets_dir/deploy" "$targets_dir/releases/$GEOFLOW_VERSION" "$targets_dir/updater/$UPDATER_VERSION"
          cp assets/docker-compose.managed.yml "$targets_dir/deploy/docker-compose.managed.yml"
          cp geoflow/version.json "$targets_dir/releases/$GEOFLOW_VERSION/version.json"
          cp dist/geoflow-updater_*.tar.gz dist/checksums.txt "$targets_dir/updater/$UPDATER_VERSION/"
          jq -n \
            --argjson sequence "$RELEASE_SEQUENCE" \
            --arg version "$GEOFLOW_VERSION" \
            --arg source_commit "$GEOFLOW_SOURCE_COMMIT" \
            --arg app_image "ghcr.io/yaojingang/geoflow-app@$APP_DIGEST" \
            --arg web_image "ghcr.io/yaojingang/geoflow-web@$WEB_DIGEST" \
            --arg postgres_16_image "pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b" \
            --arg postgres_18_image "pgvector/pgvector@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a" \
            --arg redis_7_image "redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf" \
            --arg redis_8_image "redis@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576" \
            --arg version_target "releases/$GEOFLOW_VERSION/version.json" \
            '{schema_version:1,release_sequence:$sequence,version:$version,source_commit:$source_commit,app_image:$app_image,web_image:$web_image,postgres_images:{"16":$postgres_16_image,"18":$postgres_18_image},redis_images:{"7":$redis_7_image,"8":$redis_8_image},compose_target:"deploy/docker-compose.managed.yml",version_target:$version_target}' \
            > "$targets_dir/releases/current.json"
          go run ./cmd/geoflow-tuf publish \
            --repository-dir tuf/repository \
            --targets-dir "$targets_dir" \
            --targets-key "$RUNNER_TEMP/targets.pem" \
            --snapshot-key "$RUNNER_TEMP/snapshot.pem" \
            --timestamp-key "$RUNNER_TEMP/timestamp.pem"
      - name: Stage updater assets in a draft GitHub release
        if: needs.preflight.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_VERSION: ${{ inputs.updater_version }}
          GEOFLOW_VERSION: ${{ inputs.geoflow_version }}
        run: |
          if gh release view "v$UPDATER_VERSION" >/dev/null 2>&1; then
            test "$(gh release view "v$UPDATER_VERSION" --json isDraft --jq '.isDraft')" = true
            gh release edit "v$UPDATER_VERSION" --target "$GITHUB_SHA"
            gh release upload "v$UPDATER_VERSION" \
              dist/geoflow-updater_*.tar.gz \
              dist/checksums.txt \
              dist/bootstrap-manifest.json \
              --clobber
          else
            gh release create "v$UPDATER_VERSION" \
              dist/geoflow-updater_*.tar.gz \
              dist/checksums.txt \
              dist/bootstrap-manifest.json \
              --draft \
              --target "$GITHUB_SHA" \
              --title "GEOFlow Updater v$UPDATER_VERSION" \
              --notes "Installs GEOFlow Updater and enrolls GEOFlow $GEOFLOW_VERSION managed deployments."
          fi
      - name: Commit public TUF metadata
        if: needs.preflight.outputs.resume != 'true'
        env:
          GEOFLOW_VERSION: ${{ inputs.geoflow_version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tuf/repository
          git commit -m "release: publish GEOFlow $GEOFLOW_VERSION metadata"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Validate and publish the updater release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_VERSION: ${{ inputs.updater_version }}
        run: |
          release_dir="$(mktemp -d)"
          gh release download "v$UPDATER_VERSION" --dir "$release_dir"
          assets="$(find "$release_dir" -maxdepth 1 -type f -exec basename {} \; | sort)"
          for required in \
            "geoflow-updater_${UPDATER_VERSION}_linux_amd64.tar.gz" \
            "geoflow-updater_${UPDATER_VERSION}_linux_arm64.tar.gz" \
            checksums.txt \
            bootstrap-manifest.json; do
            printf '%s\n' "$assets" | grep -Fqx "$required"
          done
          snapshot_version="$(jq -er '.signed.meta["snapshot.json"].version' tuf/repository/metadata/timestamp.json)"
          targets_version="$(jq -er '.signed.meta["targets.json"].version' "tuf/repository/metadata/${snapshot_version}.snapshot.json")"
          targets_metadata="tuf/repository/metadata/${targets_version}.targets.json"
          for asset in \
            "geoflow-updater_${UPDATER_VERSION}_linux_amd64.tar.gz" \
            "geoflow-updater_${UPDATER_VERSION}_linux_arm64.tar.gz" \
            checksums.txt; do
            target="updater/$UPDATER_VERSION/$asset"
            expected_hash="$(jq -er --arg target "$target" '.signed.targets[$target].hashes.sha256' "$targets_metadata")"
            expected_length="$(jq -er --arg target "$target" '.signed.targets[$target].length' "$targets_metadata")"
            test "$(sha256sum "$release_dir/$asset" | cut -d ' ' -f 1)" = "$expected_hash"
            test "$(stat -c '%s' "$release_dir/$asset")" = "$expected_length"
          done
          go run ./cmd/geoflow-tuf verify-bootstrap \
            --manifest "$release_dir/bootstrap-manifest.json" \
            --trusted-root tuf/repository/metadata/root.json \
            --updater-version "$UPDATER_VERSION"
          for arch in amd64 arm64; do
            archive="geoflow-updater_${UPDATER_VERSION}_linux_${arch}.tar.gz"
            platform="linux-${arch}"
            test "$(jq -er --arg platform "$platform" '.signed.assets[$platform].sha256' "$release_dir/bootstrap-manifest.json")" = "$(sha256sum "$release_dir/$archive" | cut -d ' ' -f 1)"
            test "$(jq -er --arg platform "$platform" '.signed.assets[$platform].size' "$release_dir/bootstrap-manifest.json")" = "$(stat -c '%s' "$release_dir/$archive")"
          done
          if [ "$(gh release view "v$UPDATER_VERSION" --json isDraft --jq '.isDraft')" = true ]; then
            gh release edit "v$UPDATER_VERSION" --draft=false --latest=false
          fi
      - name: Promote immutable and convenience image tags
        env:
          APP_DIGEST: ${{ needs.preflight.outputs.resume == 'true' && needs.preflight.outputs.app_digest || needs.images.outputs.app_digest }}
          WEB_DIGEST: ${{ needs.preflight.outputs.resume == 'true' && needs.preflight.outputs.web_digest || needs.images.outputs.web_digest }}
          GEOFLOW_VERSION: ${{ inputs.geoflow_version }}
        run: |
          promote() {
            repository="$1"
            digest="$2"
            version_ref="$repository:$GEOFLOW_VERSION"
            if docker buildx imagetools inspect "$version_ref" >/dev/null 2>&1; then
              existing="$(docker buildx imagetools inspect "$version_ref" --format '{{.Manifest.Digest}}')"
              if [ "$existing" != "$digest" ]; then
                echo "$version_ref already points to unexpected digest $existing." >&2
                exit 1
              fi
            else
              docker buildx imagetools create --tag "$version_ref" "$repository@$digest"
            fi
            docker buildx imagetools create --tag "$repository:latest" "$repository@$digest"
          }
          promote ghcr.io/yaojingang/geoflow-app "$APP_DIGEST"
          promote ghcr.io/yaojingang/geoflow-web "$WEB_DIGEST"
      - name: Deploy committed metadata through Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.preflight.outputs.resume != 'true'
        with:
          name: geoflow-updater-${{ inputs.updater_version }}
          path: |
            dist/geoflow-updater_*.tar.gz
            dist/checksums.txt
            dist/bootstrap-manifest.json
          if-no-files-found: error
